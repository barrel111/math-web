title: math on the web
author: barrel111
version: 1.0.0
quarto-required: ">=1.7.0"
contributes:
  filters:
    - sty.lua
  formats:
    html:
      filters:
        - sty.lua
      theme: yeti
      mainfont: EB Garamond

      toc: true
      toc-location: right

      css: custom.scss

      html-math-method: 
        method: mathjax
        url: "https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-mml-chtml.js"
